<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organograma Hemominas</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Organograma</h1>
      <p>Estrutura Orgânica da Fundação Hemominas — Administração Central</p>
      <p class="aviso">Protótipo: nomes, cargos, ramais e e-mails são fictícios.</p>
    </header>

    <section class="quadro" aria-label="Administração Central">
      <div class="coluna" id="cadeia"></div>
      <div class="assessorias" id="assessorias">
        <span class="linha-central"></span>
      </div>
    </section>
  </main>

  <dialog id="card" class="card" aria-labelledby="card-setor">
    <button type="button" class="card-fechar" id="card-fechar" aria-label="Fechar">&times;</button>
    <div class="card-foto" id="card-foto"></div>
    <h2 class="card-setor" id="card-setor"></h2>
    <dl class="card-dados">
      <dt>Gestor</dt>
      <dd id="card-nome"></dd>
      <dt>Cargo</dt>
      <dd id="card-cargo"></dd>
      <dt>Ramal</dt>
      <dd id="card-ramal"></dd>
      <dt>E-mail</dt>
      <dd id="card-email"></dd>
    </dl>
  </dialog>

  <script src="gestores.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
